name: decomp.dev progress
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check repository structure
        run: python3 tools/check_repository.py
      - name: Test progress accounting
        run: python3 -m unittest discover -s tools/tests -p test_decomp_progress.py -v
      - name: Validate snapshot and generate report
        run: python3 tools/decomp_progress.py export
      - name: Publish USA progress
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: USA_report
          path: report.json
          if-no-files-found: error
